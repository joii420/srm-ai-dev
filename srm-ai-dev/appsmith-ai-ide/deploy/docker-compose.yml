version: "3.8"

services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    container_name: aiide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aiide}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aiide_dev}
      POSTGRES_DB: ${DB_NAME:-aiide}
    ports:
      - "${DB_PORT_EXPOSE:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiide}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Appsmith AI IDE (Frontend + Backend in one container) ----
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: appsmith-ai-ide:latest
    container_name: aiide-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
      - "${BACKEND_PORT:-3100}:3100"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-aiide}
      DB_PASSWORD: ${DB_PASSWORD:-aiide_dev}
      DB_NAME: ${DB_NAME:-aiide}
      # JWT
      AIIDE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AIIDE_AUTH_JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-28800}
      # Container management
      AIIDE_CONTAINER_IMAGE_NAME: ${CONTAINER_IMAGE_NAME:-appsmith-ai-ide-container:latest}
      AIIDE_CONTAINER_MEMORY_LIMIT: ${CONTAINER_MEMORY_LIMIT:-1g}
      AIIDE_CONTAINER_CPU_LIMIT: ${CONTAINER_CPU_LIMIT:-1.0}
      AIIDE_CONTAINER_MAX_CONCURRENT: ${CONTAINER_MAX_CONCURRENT:-20}
      # SSH / Git
      AIIDE_SSH_KEY_ENCRYPT_SECRET: ${SSH_KEY_ENCRYPT_SECRET:-change-me-in-production}
      AIIDE_GIT_TOKEN: ${GIT_TOKEN:-}
      AIIDE_GITLAB_REPO_PREFIX: ${GIT_REPO_PREFIX:-}
      AIIDE_SSH_KEY_PATH: ${SSH_KEY_PATH:-/opt/sshkey/id_rsa}
      # AI Agent
      AIIDE_AI_AGENT_URL: ${AI_AGENT_URL:-}
      AIIDE_BACKEND_URL_FOR_CONTAINER: ${BACKEND_URL_FOR_CONTAINER:-http://host.docker.internal:3100}
      # Appsmith session (optional)
      AIIDE_APPSMITH_SESSION: ${APPSMITH_SESSION:-}
      AIIDE_APPSMITH_XSRF_TOKEN: ${APPSMITH_XSRF_TOKEN:-}
      # Third-party Page API (optional)
      PAGES_THIRD_PARTY_API_URL: ${PAGES_THIRD_PARTY_API_URL:-}
      PAGES_THIRD_PARTY_API_TOKEN: ${PAGES_THIRD_PARTY_API_TOKEN:-}
    volumes:
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH key directory (optional)
      - ${SSH_KEY_DIR:-./sshkey}:/opt/sshkey:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
    driver: local
