# Server
quarkus.http.host=0.0.0.0
quarkus.http.port=3100
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173

quarkus.profile=private
# Flyway - disabled (schema managed by Prisma from Node.js backend)
quarkus.flyway.migrate-at-start=false

# JWT (HMAC-based via com.auth0:java-jwt)
aiide.auth.jwt-expires-in=28800
# Disable SmallRye JWT (we use custom HMAC-based JWT handling)
quarkus.smallrye-jwt.enabled=false

# Logging
quarkus.log.level=INFO
quarkus.log.console.json=false

# HTTP request logging (access log)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D ms

# Hibernate SQL logging
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=${quarkus.hibernate-orm.log.sql}
quarkus.hibernate-orm.log.bind-parameters=${quarkus.hibernate-orm.log.sql}

# Custom config
aiide.container.image-name=appsmith-ai-ide-container:latest
aiide.container.memory-limit=1g
aiide.container.cpu-limit=1.0
aiide.container.max-concurrent=20
aiide.container.health-check-timeout=60
aiide.ssh-key-encrypt-secret=any-random-32char-string-here
aiide.jwt-secret=wzhf
aiide.external-auth-api-url=${EXTERNAL_AUTH_API_URL:}
aiide.backend-url-for-container=http://host.docker.internal:3100

# AI Agent URL: injected into container as env var, the container AI Proxy
# will call this URL instead of Claude API directly.
# The container AI Proxy still handles: context building, code suggestion extraction, file ops.
# Example: http://host.docker.internal:8080/api/agent/chat
aiide.ai-agent-url=http://host.docker.internal:8080/api/agent/chat

aiide.edit-lock-api-url=http://test.srm.wzhf.com:9000/script-engine

# Appsmith API base URL for building edit URLs from pageId
# Edit URL pattern: {base-url}/{pageId}/edit
aiide.appsmith-api-base-url=http://test.srm.wzhf.com:9000/api/v1/consolidated-api/edit?defaultPageId=%s&viewPageId=%s

# HTTP service implementation: httpclient (java.net.http.HttpClient) or httputil (HttpURLConnection)
aiide.http-service-type=httputil

# Redux Node Service: host path to mount into container at /server/redux-node-service
# Leave empty to auto-detect from relative paths, or set absolute path
aiide.redux-node-service-path=D:\\a-joii\\project\\srm-ai\\ai-code\\srm-ai-dev\\appsmith-ai-ide\\packages\\redux-node-service
