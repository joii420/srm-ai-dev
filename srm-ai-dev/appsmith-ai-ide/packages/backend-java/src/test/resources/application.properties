# Test profile configuration
quarkus.http.test-port=0

# Test database — separate from production to avoid data loss
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=aiide
quarkus.datasource.password=aiide_dev
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/aiide_test

# Drop and recreate schema for clean test runs
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Flyway disabled
quarkus.flyway.migrate-at-start=false

# JWT
aiide.auth.jwt-expires-in=3600
aiide.jwt-secret=test-secret-key-for-unit-tests
aiide.ssh-key-encrypt-secret=test-ssh-encrypt-secret-32chars!
aiide.external-auth-api-url=

# Container config
aiide.container.image-name=test-image:latest
aiide.container.max-concurrent=5
aiide.container.health-check-timeout=10
aiide.backend-url-for-container=http://localhost:3100
aiide.gitlab-repo-prefix=git@gitlab.test:group/
aiide.git-token=
aiide.ssh-key-path=

# Disable SmallRye JWT
quarkus.smallrye-jwt.enabled=false

# HTTP service type
aiide.http-service-type=httpclient

# Appsmith API
aiide.appsmith-api-base-url=
